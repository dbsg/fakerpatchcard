<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的收藏 - 小丁卡册</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/collection.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="container header-inner">
        <div class="header-left">
          <h1 class="logo">🃏 我的收藏</h1>
          <p class="subtitle">球星卡图鉴收集记录</p>
        </div>
        <div class="header-right">
          <a href="index.html" class="nav-link">← 返回首页</a>
        </div>
      </div>
    </header>

    <!-- 密码验证 -->
    <div id="authPanel" class="auth-panel">
      <div class="auth-box">
        <h2 class="auth-title">🔒 需要验证</h2>
        <p class="auth-desc">请输入密码查看收藏内容</p>
        <input type="password" id="authPassword" class="auth-input" placeholder="请输入密码" autofocus>
        <button class="auth-btn" onclick="collection.authenticate()">确认</button>
      </div>
    </div>

    <!-- 主内容（验证后显示） -->
    <main id="mainContent" class="main-content" style="display: none;">
      <div class="container">
        <div id="seriesList" class="series-list"></div>
      </div>
    </main>

    <!-- 系列详情弹窗 -->
    <div id="seriesModal" class="series-modal" style="display: none;">
      <div class="series-modal-content">
        <div class="series-modal-header">
          <h2 id="modalTitle" class="series-modal-title"></h2>
          <span class="series-modal-close" onclick="collection.closeDetail()">&times;</span>
        </div>
        <div id="modalBody" class="series-modal-body"></div>
      </div>
    </div>

    <!-- 图片预览 -->
    <div id="imagePreview" class="image-preview" style="display: none;" onclick="collection.closePreview()">
      <img id="previewImg" class="preview-img" src="" alt="">
    </div>

    <footer class="footer">
      <div class="container">
        <p>小丁卡册 · 个人收藏记录</p>
      </div>
    </footer>
  </div>

  <script src="js/collection-data.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
