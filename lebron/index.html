<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1017">
  <meta name="description" content="沿着勒布朗的生涯探索 NBA 授权球星卡。按产品、版本和球衣查找，查看卡片正背面与来源。">
  <title>勒布朗全图鉴 · 小丁卡册</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body class="atlas-page">
  <header class="masthead">
    <div class="brand">
      <a class="home-link" href="../index.html" aria-label="返回小丁卡册">↖</a>
      <h1 id="atlas-title">勒布朗全图鉴</h1>
    </div>
    <nav aria-label="图鉴导航">
      <a href="#atlas" id="atlas-link">生涯星图</a>
      <a href="#catalog" id="catalog-link">查目录</a>
    </nav>
  </header>

  <main>
    <section id="atlas" aria-labelledby="atlas-title">
      <div class="observatory" id="observatory">
        <canvas id="dust" aria-hidden="true"></canvas>
        <div class="sky" id="sky">
          <div id="scene" class="scene">
            <div class="stars" id="stars" aria-label="当前星区球星卡"></div>
            <div class="spotlight" id="spotlight"></div>
          </div>
          <p class="sky-era" id="sky-era" aria-live="polite"></p>
          <p class="sky-gesture">← 左右滑动切换时期 →</p>
          <div class="sky-actions">
            <button type="button" class="random" id="random" disabled>随机看一张 <span aria-hidden="true">↗</span></button>
            <p id="random-status" role="status"></p>
          </div>
        </div>
        <div class="trajectory">
          <div class="timeline" id="timeline" role="group" aria-label="生涯轨迹，支持方向键或左右滑动"></div>
        </div>
      </div>
      <section class="collection-row" aria-labelledby="coverage-title">
        <div>
          <h2 id="coverage-title">图鉴收录</h2>
          <p id="coverage">正在读取发行目录…</p>
        </div>
        <a href="#catalog">查看发行目录 <span aria-hidden="true">→</span></a>
      </section>
    </section>

    <section class="catalog" id="catalog" hidden aria-labelledby="catalog-title">
      <h2 id="catalog-title">发行目录<span class="title-dot">.</span></h2>
      <form class="filters" id="filters" role="search">
        <label class="search">搜索卡片<input type="search" name="q" placeholder="例如 #1 金折" autocomplete="off"></label>
        <div id="select-filters"></div>
        <fieldset class="feature-filters"><legend>卡片特征</legend><div id="feature-filters"></div></fieldset>
        <button type="reset" class="quiet">清空筛选</button>
      </form>
      <p id="results-status" role="status"></p>
      <div id="results"></div>
    </section>
    <p class="page-message" id="page-message" role="alert" hidden></p>
  </main>

  <dialog id="card-dialog" aria-labelledby="detail-title">
    <button id="close-card" class="close" aria-label="关闭详情" autofocus>×</button>
    <div class="detail" id="card-detail"></div>
  </dialog>
  <dialog id="zoom-dialog" aria-label="卡图放大">
    <button class="close" id="close-zoom" aria-label="关闭大图" autofocus>×</button>
  </dialog>
</body>
</html>
