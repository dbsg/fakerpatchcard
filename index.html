<head>

  <meta property="og:title" content="小丁卡册 - 球星卡收藏图鉴与问题卡鉴别">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://dbsg.github.io/fakerpatchcard/">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/collection.css">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "小丁卡册",
    "description": "球星卡收藏图鉴与问题卡鉴别数据库，帮助收藏者记录收藏、鉴别真伪",
    "url": "https://dbsg.github.io/fakerpatchcard/",
    "author": {
      "@type": "Organization",
      "name": "球星卡TV"
    },
    "inLanguage": "zh-CN"
  }
  </script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="container header-inner">
        <div class="header-left">
          <h1 class="logo">🃏 小丁卡册</h1>
          <p class="subtitle">球星卡收藏图鉴 · 问题卡鉴别数据库</p>
        </div>
        <div class="header-right">
          <img src="images/miniprogram-qrcode.png" alt="小程序码" class="miniprogram-qr" />
          <span class="miniprogram-hint">微信搜索「小丁卡册」<br>或扫码访问小程序</span>
        </div>
      </div>
    </header>

    <div class="main-tabs-wrapper">
      <div class="container">
        <div class="main-tabs" id="mainTabs" role="tablist">
          <button type="button" class="main-tab active" data-tab="cards" role="tab" aria-selected="true">问题球星卡</button>
          <button type="button" class="main-tab" data-tab="collection" role="tab" aria-selected="false">球星卡图鉴</button>
        </div>
      </div>
    </div>

    <div id="panelCards">
      <!-- Search & Filter -->
      <div class="search-section">
        <div class="container">
          <div class="filters-row">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="搜索球员名（支持中英文）、系列、编号..."
            >

            <select id="playerFilter" class="filter-select" onchange="app.applyFilters()">
              <option value="">全部球员</option>
            </select>

            <select id="brandFilter" class="filter-select" onchange="app.applyFilters()">
              <option value="">全部品牌</option>
            </select>

            <select id="yearFilter" class="filter-select" onchange="app.applyFilters()">
              <option value="">全部年份</option>
            </select>

            <button class="reset-btn" onclick="app.resetFilters()">重置</button>
          </div>

          <div class="stats">
            <span class="stat-item">记录总数: <strong id="totalCount">0</strong> 张</span>
          </div>
        </div>
      </div>

      <!-- Card List -->
      <main class="main-content">
        <div class="container">
          <div id="cardList" class="card-grid">
            <!-- 卡片将通过JavaScript动态生成 -->
          </div>

          <div id="pagination" class="pagination">
            <!-- 分页按钮将通过JavaScript动态生成 -->
          </div>

          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📭</div>
            <p class="empty-text">未找到相关卡片</p>
          </div>

          <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
          </div>
        </div>
      </main>
    </div>

    <div id="panelCollection" class="collection-home-panel" style="display: none;">
      <main class="main-content">
        <div class="container">
          <p class="collection-home-hint">以下为球星卡图鉴收集记录，点击系列进入详情。</p>
          <div id="seriesListIndex" class="series-list"></div>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>仅供参考，请谨慎交易</p>
        <p>发现可疑卡片，可以反馈给<a href="https://space.bilibili.com/1241227510" target="_blank"> 球星卡TV </a>，或者<a href="https://github.com/dbsg/fakerpatchcard/issues" target="_blank"> GitHub </a>提交 Issue</p>
        <p class="footer-stats">
          今日访问 <span id="busuanzi_today_pv">-</span> 次 |
          今日访客 <span id="busuanzi_today_uv">-</span> 人 |
          总访问 <span id="busuanzi_site_pv">-</span> 次 |
          总访客 <span id="busuanzi_site_uv">-</span> 人
        </p>
      </div>
    </footer>
  </div>

  <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/collection-data.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
