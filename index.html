<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小丁卡册 - 球星卡图鉴与鉴别资料库</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="小丁卡册，球星卡收藏图鉴与鉴别资料库。收录球星卡图鉴收集记录，以及 Patch 异常、卡片异常、签字异常等资料，帮助收藏者做特征对比。">
  <meta name="keywords" content="球星卡,球星卡图鉴,球星卡收藏,小丁卡册,Patch异常,卡片异常,签字异常,明确异常,高度存疑,NBA球星卡,Panini,Upper Deck,Immaculate,National Treasures,球星卡鉴别资料,basketball cards">
  <meta name="author" content="球星卡TV">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dbsg.github.io/fakerpatchcard/">
  <meta property="og:title" content="小丁卡册 - 球星卡图鉴与鉴别资料库">
  <meta property="og:description" content="小丁卡册，球星卡图鉴与鉴别资料库。帮助收藏者整理图鉴、做特征对比。">
  <meta property="og:image" content="https://dbsg.github.io/fakerpatchcard/images/og-image.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://dbsg.github.io/fakerpatchcard/">
  <meta property="twitter:title" content="小丁卡册 - 球星卡图鉴与鉴别资料库">
  <meta property="twitter:description" content="小丁卡册，球星卡图鉴与鉴别资料库。帮助收藏者整理图鉴、做特征对比。">
  <meta property="twitter:image" content="https://dbsg.github.io/fakerpatchcard/images/og-image.jpg">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://dbsg.github.io/fakerpatchcard/">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/collection.css">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "小丁卡册",
    "description": "球星卡图鉴与鉴别资料库，帮助收藏者整理图鉴、做特征对比",
    "url": "https://dbsg.github.io/fakerpatchcard/",
    "author": {
      "@type": "Organization",
      "name": "球星卡TV"
    },
    "inLanguage": "zh-CN"
  }
  </script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="container header-inner">
        <div class="header-left">
          <h1 class="logo">🃏 小丁卡册</h1>
          <p class="subtitle">球星卡图鉴 · 鉴别资料库</p>
        </div>
        <div class="header-right">
          <img src="images/miniprogram-qrcode.png" alt="小程序码" class="miniprogram-qr" />
          <span class="miniprogram-hint">微信搜索「小丁卡册」<br>或扫码访问小程序</span>
        </div>
      </div>
    </header>

    <div class="main-tabs-wrapper">
      <div class="container">
        <div class="main-tabs" id="mainTabs" role="tablist">
          <button type="button" class="main-tab active" data-tab="cards" role="tab" aria-selected="true">
            <span class="tab-title">鉴别资料库</span>
            <span class="tab-desc">查卡避坑·资料参考</span>
          </button>
          <button type="button" class="main-tab" data-tab="collection" role="tab" aria-selected="false">
            <span class="tab-title">球星卡图鉴</span>
            <span class="tab-desc">整理图鉴·补图进度</span>
          </button>
        </div>
      </div>
    </div>

    <div id="panelCards">
      <!-- Search & Filter -->
      <div class="search-section">
        <div class="container">
          <div class="filters-row">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="搜索球员、系列、编号、识别点；如 勒布朗 99"
            >
          </div>

          <div class="category-filter-scroll" aria-label="资料类型筛选">
            <div id="categoryFilterTags" class="category-filter-tags"></div>
          </div>

          <div class="stats">
            <span class="stat-item">共 <strong id="totalCount">0</strong> 条资料</span>
          </div>
        </div>
      </div>

      <!-- Card List -->
      <main class="main-content">
        <div class="container">
          <div id="cardList" class="card-grid">
            <!-- 卡片将通过JavaScript动态生成 -->
          </div>

          <div id="pagination" class="pagination">
            <!-- 分页按钮将通过JavaScript动态生成 -->
          </div>

          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📭</div>
            <p class="empty-text">未找到相关资料</p>
          </div>

          <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
          </div>
        </div>
      </main>
    </div>

    <div id="panelCollection" class="collection-home-panel" style="display: none;">
      <main class="main-content">
        <div class="container">
          <p class="collection-home-hint">以下为球星卡图鉴收集记录，点击系列进入详情。</p>
          <div class="series-toolbar">
            <div class="series-search-bar">
              <svg class="series-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" id="seriesSearchInput" class="series-search-input" placeholder="搜索图鉴...">
              <span id="seriesSearchClear" class="series-search-clear" style="display:none;">✕</span>
            </div>
            <button type="button" id="seriesSortBtn" class="series-sort-btn">名称排序</button>
          </div>
          <div id="seriesListIndex" class="series-list"></div>
          <div id="seriesEmptyState" class="col-empty" style="display:none;">未找到匹配的图鉴</div>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>资料仅用于收藏研究与卡片特征对比，不构成鉴定结论、交易建议或维权依据。</p>
        <p>发现可疑卡片，可以反馈给<a href="https://space.bilibili.com/1241227510" target="_blank"> 球星卡TV </a>，或者<a href="https://github.com/dbsg/fakerpatchcard/issues" target="_blank"> GitHub </a>提交 Issue</p>
        <p class="footer-stats">
          今日访问 <span id="busuanzi_today_pv">-</span> 次 |
          今日访客 <span id="busuanzi_today_uv">-</span> 人 |
          总访问 <span id="busuanzi_site_pv">-</span> 次 |
          总访客 <span id="busuanzi_site_uv">-</span> 人
        </p>
      </div>
    </footer>
  </div>

  <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/collection-data.js"></script>
  <script src="js/collection-progress.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
