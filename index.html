  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "问题球星卡图库",
    "description": "问题球星卡图库，收录换Patch、假卡、假签等问题球星卡案例，帮助收藏者鉴别真伪",
    "url": "https://dbsg.github.io/fakerpatchcard/",
    "author": {
      "@type": "Organization",
      "name": "球星卡TV"
    },
    "inLanguage": "zh-CN"
  }
  </script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="container header-inner">
        <div class="header-left">
          <h1 class="logo">🏀 问题球星卡图库</h1>
          <p class="subtitle">收录换Patch、假卡、假签等问题卡记录，帮助收藏者避坑</p>
        </div>
        <div class="header-right">
          <img src="images/miniprogram-qrcode.png" alt="小程序码" class="miniprogram-qr" />
          <span class="miniprogram-hint">微信搜索「小丁卡册」<br>或扫码访问小程序</span>
        </div>
      </div>
    </header>

    <!-- Category Tabs -->
    <div class="category-tabs-wrapper">
      <div class="container">
        <div class="category-tabs" id="categoryTabs">
          <div class="category-tab active" data-category="fake-patch" onclick="app.switchCategory('fake-patch')">
            换Patch
          </div>
          <div class="category-tab" data-category="fake-auto" onclick="app.switchCategory('fake-auto')">
            假签
          </div>
          <div class="category-tab" data-category="counterfeit" onclick="app.switchCategory('counterfeit')">
            假卡
          </div>
        </div>
      </div>
    </div>

    <!-- Search & Filter -->
    <div class="search-section">
      <div class="container">
        <div class="filters-row">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="搜索球员名（支持中英文）、系列、编号..."
          >

          <select id="playerFilter" class="filter-select" onchange="app.applyFilters()">
            <option value="">全部球员</option>
          </select>

          <select id="brandFilter" class="filter-select" onchange="app.applyFilters()">
            <option value="">全部品牌</option>
          </select>

          <select id="yearFilter" class="filter-select" onchange="app.applyFilters()">
            <option value="">全部年份</option>
          </select>

          <button class="reset-btn" onclick="app.resetFilters()">重置</button>
        </div>

        <div class="stats">
          <span class="stat-item">记录总数: <strong id="totalCount">0</strong> 张</span>
        </div>
      </div>
    </div>

    <!-- Card List -->
    <main class="main-content">
      <div class="container">
        <div id="cardList" class="card-grid">
          <!-- 卡片将通过JavaScript动态生成 -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination">
          <!-- 分页按钮将通过JavaScript动态生成 -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-icon">📭</div>
          <p class="empty-text">未找到相关卡片</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>仅供参考，请谨慎交易</p>
        <p>发现可疑卡片，可以反馈给<a href="https://space.bilibili.com/1241227510" target="_blank"> 球星卡TV </a>，或者<a href="https://github.com/dbsg/fakerpatchcard/issues" target="_blank"> GitHub </a>提交 Issue</p>
        <p class="footer-stats">
          今日访问 <span id="busuanzi_today_pv">-</span> 次 |
          今日访客 <span id="busuanzi_today_uv">-</span> 人 |
          总访问 <span id="busuanzi_site_pv">-</span> 次 |
          总访客 <span id="busuanzi_site_uv">-</span> 人
        </p>
      </div>
    </footer>
  </div>

  <script src="//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
